<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic / Animated Cyber Wave & Grid Background Elements -->
  <g opacity="0.15">
    <path d="M 0 150 Q 300 50 600 150 T 1200 150 L 1200 400 L 0 400 Z" fill="#38bdf8">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M 0 150 Q 300 50 600 150 T 1200 150 L 1200 400 L 0 400 Z;
                M 0 180 Q 300 100 600 180 T 1200 180 L 1200 400 L 0 400 Z;
                M 0 150 Q 300 50 600 150 T 1200 150 L 1200 400 L 0 400 Z" />
    </path>
    <path d="M 0 220 Q 300 120 600 220 T 1200 220 L 1200 400 L 0 400 Z" fill="#818cf8">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M 0 220 Q 300 120 600 220 T 1200 220 L 1200 400 L 0 400 Z;
                M 0 200 Q 300 160 600 200 T 1200 200 L 1200 400 L 0 400 Z;
                M 0 220 Q 300 120 600 220 T 1200 220 L 1200 400 L 0 400 Z" />
    </path>
  </g>

  <!-- Glowing Attack Pulse Circles (Dynamic Particles behind text) -->
  <circle cx="150" cy="100" r="4" fill="#38bdf8" opacity="0.6" filter="url(#glow)">
    <animate attributeName="r" values="4;12;4" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="300" r="6" fill="#818cf8" opacity="0.5" filter="url(#glow)">
    <animate attributeName="r" values="6;16;6" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Shield Icon -->
  <g transform="translate(560, 45)">
    <path d="M 40 0 L 75 15 C 75 55 60 85 40 100 C 20 85 5 55 5 15 Z" fill="url(#shield-grad)" filter="url(#glow)" opacity="0.95"/>
    <path d="M 40 20 L 60 30 C 60 55 50 72 40 82 C 30 72 20 55 20 30 Z" fill="#0f172a"/>
    <path d="M 32 48 L 40 56 L 52 40" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Main Title & Subtitle (Clear Foreground, Unobstructed) -->
  <text x="600" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="40" fill="url(#text-grad)" letter-spacing="1">
    Awesome DDoS Protection
  </text>
  
  <text x="600" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#94a3b8" letter-spacing="0.5">
    Curated Enterprise Scrubbing Platforms &amp; Open-Source Traffic Mitigation
  </text>

  <!-- Feature Pills in Bottom Foreground -->
  <g transform="translate(600, 325)">
    <!-- Pill 1 -->
    <rect x="-310" y="-18" width="180" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="-220" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🛡️ Anycast Scrubbing</text>
    
    <!-- Pill 2 -->
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🌊 Volumetric &amp; L7 Mitigation</text>

    <!-- Pill 3 -->
    <rect x="130" y="-18" width="180" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="220" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ eBPF / XDP Filtering</text>
  </g>
</svg>
